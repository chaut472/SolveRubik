<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #18191C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #hud {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .hud-btn {
            background: rgba(30, 41, 59, 0.85);
            color: #94A3B8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        .hud-btn:hover {
            background: #2563EB;
            color: #FFFFFF;
            border-color: #38BDF8;
        }
        #info-overlay {
            position: absolute;
            bottom: 10px;
            left: 12px;
            color: #64748B;
            font-size: 11px;
            pointer-events: none;
        }
    </style>
    <script src="three.min.js"></script>
    <script src="orbit_controls.js"></script>
</head>
<body>
    <div id="hud">
        <button class="hud-btn" onclick="resetCameraView()">🔄 Đặt Lại Góc Nhìn</button>
    </div>
    <div id="info-overlay">Kéo chuột trái để xoay 360° • Cuộn chuột để zoom</div>
    <div id="canvas-container"></div>

    <script>
        // Bảng mã màu khớp 100% với COLOR_HEX trong constants.py
        const COLOR_MAP = {
            'W': 0xFFFFFF, // Up (Trắng)
            'Y': 0xFFD500, // Down (Vàng)
            'G': 0x009B48, // Front (Xanh lá)
            'B': 0x0046AD, // Back (Xanh dương)
            'R': 0xB71234, // Right (Đỏ)
            'O': 0xFF5800, // Left (Cam)
            '?': 0x3C3F41, // Chưa xác định
            'INTERNAL': 0x141416 // Mặt trong khối Rubik
        };

        const SCENE_BG = 0x18191C;
        const CUBIE_SIZE = 0.96;
        const CUBIE_GAP = 1.02;

        let scene, camera, renderer, controls;
        let cubies = [];
        let cubiesByCoord = {}; // Lookup dạng "x,y,z"
        let pivot;
        let isAnimating = false;
        let activeLayerCubies = [];
        let currentAnimationId = null;
        let latestColorString = "WWWWWWWWWRRRRRRRRRGGGGGGGGGYYYYYYYYYOOOOOOOOOBBBBBBBBB";

        // Bảng ánh xạ chính xác 54 ô (Stickers) theo đúng thứ tự URFDLB (0..53)
        // Material Index trong BoxGeometry của Three.js:
        // 0: +X (Right)
        // 1: -X (Left)
        // 2: +Y (Up)
        // 3: -Y (Down)
        // 4: +Z (Front)
        // 5: -Z (Back)
        const STICKER_MAPPINGS = {
            // Face U (0..8): y = +1, mặt +Y (mat: 2)
            // Hàng 0 (z = -1, kề B): x = -1, 0, 1
            // Hàng 1 (z =  0):       x = -1, 0, 1
            // Hàng 2 (z =  1, kề F): x = -1, 0, 1
            U: [
                { x: -1, y: 1, z: -1, mat: 2 },
                { x:  0, y: 1, z: -1, mat: 2 },
                { x:  1, y: 1, z: -1, mat: 2 },
                { x: -1, y: 1, z:  0, mat: 2 },
                { x:  0, y: 1, z:  0, mat: 2 },
                { x:  1, y: 1, z:  0, mat: 2 },
                { x: -1, y: 1, z:  1, mat: 2 },
                { x:  0, y: 1, z:  1, mat: 2 },
                { x:  1, y: 1, z:  1, mat: 2 }
            ],
            // Face R (9..17): x = +1, mặt +X (mat: 0)
            // Hàng 0 (y =  1, kề U): z =  1, 0, -1
            // Hàng 1 (y =  0):       z =  1, 0, -1
            // Hàng 2 (y = -1, kề D): z =  1, 0, -1
            R: [
                { x: 1, y:  1, z:  1, mat: 0 },
                { x: 1, y:  1, z:  0, mat: 0 },
                { x: 1, y:  1, z: -1, mat: 0 },
                { x: 1, y:  0, z:  1, mat: 0 },
                { x: 1, y:  0, z:  0, mat: 0 },
                { x: 1, y:  0, z: -1, mat: 0 },
                { x: 1, y: -1, z:  1, mat: 0 },
                { x: 1, y: -1, z:  0, mat: 0 },
                { x: 1, y: -1, z: -1, mat: 0 }
            ],
            // Face F (18..26): z = +1, mặt +Z (mat: 4)
            // Hàng 0 (y =  1, kề U): x = -1, 0, 1
            // Hàng 1 (y =  0):       x = -1, 0, 1
            // Hàng 2 (y = -1, kề D): x = -1, 0, 1
            F: [
                { x: -1, y:  1, z: 1, mat: 4 },
                { x:  0, y:  1, z: 1, mat: 4 },
                { x:  1, y:  1, z: 1, mat: 4 },
                { x: -1, y:  0, z: 1, mat: 4 },
                { x:  0, y:  0, z: 1, mat: 4 },
                { x:  1, y:  0, z: 1, mat: 4 },
                { x: -1, y: -1, z: 1, mat: 4 },
                { x:  0, y: -1, z: 1, mat: 4 },
                { x:  1, y: -1, z: 1, mat: 4 }
            ],
            // Face D (27..35): y = -1, mặt -Y (mat: 3)
            // Hàng 0 (z =  1, kề F): x = -1, 0, 1
            // Hàng 1 (z =  0):       x = -1, 0, 1
            // Hàng 2 (z = -1, kề B): x = -1, 0, 1
            D: [
                { x: -1, y: -1, z:  1, mat: 3 },
                { x:  0, y: -1, z:  1, mat: 3 },
                { x:  1, y: -1, z:  1, mat: 3 },
                { x: -1, y: -1, z:  0, mat: 3 },
                { x:  0, y: -1, z:  0, mat: 3 },
                { x:  1, y: -1, z:  0, mat: 3 },
                { x: -1, y: -1, z: -1, mat: 3 },
                { x:  0, y: -1, z: -1, mat: 3 },
                { x:  1, y: -1, z: -1, mat: 3 }
            ],
            // Face L (36..44): x = -1, mặt -X (mat: 1)
            // Hàng 0 (y =  1, kề U): z = -1, 0, 1
            // Hàng 1 (y =  0):       z = -1, 0, 1
            // Hàng 2 (y = -1, kề D): z = -1, 0, 1
            L: [
                { x: -1, y:  1, z: -1, mat: 1 },
                { x: -1, y:  1, z:  0, mat: 1 },
                { x: -1, y:  1, z:  1, mat: 1 },
                { x: -1, y:  0, z: -1, mat: 1 },
                { x: -1, y:  0, z:  0, mat: 1 },
                { x: -1, y:  0, z:  1, mat: 1 },
                { x: -1, y: -1, z: -1, mat: 1 },
                { x: -1, y: -1, z:  0, mat: 1 },
                { x: -1, y: -1, z:  1, mat: 1 }
            ],
            // Face B (45..53): z = -1, mặt -Z (mat: 5)
            // Hàng 0 (y =  1, kề U): x =  1, 0, -1
            // Hàng 1 (y =  0):       x =  1, 0, -1
            // Hàng 2 (y = -1, kề D): x =  1, 0, -1
            B: [
                { x:  1, y:  1, z: -1, mat: 5 },
                { x:  0, y:  1, z: -1, mat: 5 },
                { x: -1, y:  1, z: -1, mat: 5 },
                { x:  1, y:  0, z: -1, mat: 5 },
                { x:  0, y:  0, z: -1, mat: 5 },
                { x: -1, y:  0, z: -1, mat: 5 },
                { x:  1, y: -1, z: -1, mat: 5 },
                { x:  0, y: -1, z: -1, mat: 5 },
                { x: -1, y: -1, z: -1, mat: 5 }
            ]
        };

        function init() {
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth || window.innerWidth || 400;
            const h = container.clientHeight || window.innerHeight || 400;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(SCENE_BG);

            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
            camera.position.set(4.3, 3.8, 5.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 3.2;
            controls.maxDistance = 14;

            // Ánh sáng chiếu đều 6 mặt
            const ambient = new THREE.AmbientLight(0xFFFFFF, 0.78);
            scene.add(ambient);

            const dir1 = new THREE.DirectionalLight(0xFFFFFF, 0.82);
            dir1.position.set(6, 10, 8);
            scene.add(dir1);

            const dir2 = new THREE.DirectionalLight(0xA0B0D0, 0.45);
            dir2.position.set(-6, -8, -6);
            scene.add(dir2);

            pivot = new THREE.Group();
            scene.add(pivot);

            createRubikCube();

            window.addEventListener('resize', onWindowResize);
            animateLoop();

            // Nếu đã có sẵn dữ liệu màu trước khi scene tải xong
            if (latestColorString) {
                window.setCubeState(latestColorString);
            }
        }

        function createRubikCube() {
            cubies = [];
            cubiesByCoord = {};

            const geom = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        // 6 vật liệu độc lập cho mỗi cubie
                        const materials = [
                            createMat(x === 1 ? 'R' : 'INTERNAL'),
                            createMat(x === -1 ? 'O' : 'INTERNAL'),
                            createMat(y === 1 ? 'W' : 'INTERNAL'),
                            createMat(y === -1 ? 'Y' : 'INTERNAL'),
                            createMat(z === 1 ? 'G' : 'INTERNAL'),
                            createMat(z === -1 ? 'B' : 'INTERNAL')
                        ];

                        const cubie = new THREE.Mesh(geom, materials);
                        cubie.position.set(x * CUBIE_GAP, y * CUBIE_GAP, z * CUBIE_GAP);
                        cubie.userData = { gridX: x, gridY: y, gridZ: z };

                        scene.add(cubie);
                        cubies.push(cubie);
                        cubiesByCoord[`${x},${y},${z}`] = cubie;
                    }
                }
            }
        }

        function createMat(colorKey) {
            const hex = COLOR_MAP[colorKey] !== undefined ? COLOR_MAP[colorKey] : COLOR_MAP['INTERNAL'];
            return new THREE.MeshStandardMaterial({
                color: hex,
                roughness: colorKey === 'INTERNAL' ? 0.85 : 0.22,
                metalness: 0.08
            });
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            renderer.render(scene, camera);
        }

        function resetCameraView() {
            controls.reset();
            camera.position.set(4.3, 3.8, 5.2);
            controls.target.set(0, 0, 0);
        }

        // ================= ĐỒNG BỘ 54 MÀU TUYỆT ĐỐI VỚI 2D =================
        window.setCubeState = function(colorStr) {
            if (!colorStr || colorStr.length !== 54) return;
            latestColorString = colorStr;

            // Nếu đang quay dở animation, ép kết thúc ngay để cập nhật
            if (isAnimating) {
                cancelCurrentAnimation();
            }

            const faceOrder = ['U', 'R', 'F', 'D', 'L', 'B'];
            for (let fIdx = 0; fIdx < 6; fIdx++) {
                const face = faceOrder[fIdx];
                const mappings = STICKER_MAPPINGS[face];
                for (let i = 0; i < 9; i++) {
                    const charColor = colorStr[fIdx * 9 + i];
                    const hex = COLOR_MAP[charColor] !== undefined ? COLOR_MAP[charColor] : COLOR_MAP['?'];
                    const info = mappings[i];
                    const key = `${info.x},${info.y},${info.z}`;
                    const cubie = cubiesByCoord[key];
                    if (cubie && cubie.material[info.mat]) {
                        cubie.material[info.mat].color.setHex(hex);
                    }
                }
            }
        };

        // ================= DIỄN HOẠT XOAY 3D MƯỢT MÀ =================
        window.animateMove = function(move, durationMs, finalColorStr) {
            move = (move || '').trim();
            if (!move) {
                if (finalColorStr) window.setCubeState(finalColorStr);
                return;
            }

            if (finalColorStr) {
                latestColorString = finalColorStr;
            }

            if (isAnimating) {
                cancelCurrentAnimation();
            }

            const baseFace = move[0].toUpperCase();
            const mod = move.length > 1 ? move[1] : '';
            durationMs = Math.max(160, durationMs || 400);

            let axis = 'y';
            let layerCoord = 0;
            let angle = -Math.PI / 2;

            if (baseFace === 'U') {
                axis = 'y'; layerCoord = 1; angle = -Math.PI / 2;
            } else if (baseFace === 'D') {
                axis = 'y'; layerCoord = -1; angle = Math.PI / 2;
            } else if (baseFace === 'R') {
                axis = 'x'; layerCoord = 1; angle = -Math.PI / 2;
            } else if (baseFace === 'L') {
                axis = 'x'; layerCoord = -1; angle = Math.PI / 2;
            } else if (baseFace === 'F') {
                axis = 'z'; layerCoord = 1; angle = -Math.PI / 2;
            } else if (baseFace === 'B') {
                axis = 'z'; layerCoord = -1; angle = Math.PI / 2;
            }

            if (mod === "'") {
                angle = -angle;
            } else if (mod === '2') {
                angle = angle * 2;
            }

            // Tìm 9 viên thuộc lớp cần xoay
            const gridProp = (axis === 'x') ? 'gridX' : (axis === 'y' ? 'gridY' : 'gridZ');
            activeLayerCubies = cubies.filter(c => c.userData[gridProp] === layerCoord);

            // Gắn 9 viên vào pivot
            pivot.rotation.set(0, 0, 0);
            activeLayerCubies.forEach(c => {
                scene.remove(c);
                pivot.add(c);
            });

            isAnimating = true;
            const startTime = performance.now();

            function frameStep(time) {
                const elapsed = time - startTime;
                const progress = Math.min(1.0, elapsed / durationMs);
                // Cubic ease out
                const ease = 1.0 - Math.pow(1.0 - progress, 3);
                pivot.rotation[axis] = angle * ease;

                if (progress < 1.0) {
                    currentAnimationId = requestAnimationFrame(frameStep);
                } else {
                    finishAndResetToUpright(activeLayerCubies, finalColorStr);
                }
            }
            currentAnimationId = requestAnimationFrame(frameStep);
        };

        function finishAndResetToUpright(activeList, finalColorStr) {
            // Đưa 9 viên cubie về lại scene ở vị trí chuẩn ban đầu
            activeList.forEach(c => {
                pivot.remove(c);
                scene.add(c);
                c.position.set(c.userData.gridX * CUBIE_GAP, c.userData.gridY * CUBIE_GAP, c.userData.gridZ * CUBIE_GAP);
                c.rotation.set(0, 0, 0);
            });
            pivot.rotation.set(0, 0, 0);
            isAnimating = false;
            activeLayerCubies = [];
            currentAnimationId = null;

            // Đồng bộ màu 54 ô từ finalColorStr với độ chính xác 100%
            if (finalColorStr) {
                window.setCubeState(finalColorStr);
            }
        }

        function cancelCurrentAnimation() {
            if (currentAnimationId) {
                cancelAnimationFrame(currentAnimationId);
                currentAnimationId = null;
            }
            if (activeLayerCubies && activeLayerCubies.length > 0) {
                activeLayerCubies.forEach(c => {
                    pivot.remove(c);
                    scene.add(c);
                    c.position.set(c.userData.gridX * CUBIE_GAP, c.userData.gridY * CUBIE_GAP, c.userData.gridZ * CUBIE_GAP);
                    c.rotation.set(0, 0, 0);
                });
            }
            pivot.rotation.set(0, 0, 0);
            isAnimating = false;
            activeLayerCubies = [];
            if (latestColorString) {
                window.setCubeState(latestColorString);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
